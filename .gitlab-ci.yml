# The only CI this package has. It runs on version bumps, not on every merge
# request; the workflow: block below is where that is argued.
#
# .github/workflows/R-CMD-check.yaml declared six matrix rows and never executed
# once. It was deleted on 2026-09-05 (RADD-ithxwzpr) after the GitHub account
# hosting the repository stayed suspended from 2026-07-20 with the appeal
# unanswered. This file is two jobs, not six rows, and the difference is
# deliberate: five of those six rows are already answered by
# measurements in docs/ (the pre-push hook for macOS release; check-matrix.sh
# for the two Ubuntu rows; check-r-floor.sh and check-dep-floor.sh for the two
# oldrel rows, which only probe toward a floor that is measured directly). What
# CI adds is not another row. It is the things a laptop structurally cannot
# assert about itself, and there are four:
#
#   1. A CLEAN CLONE. Every local measurement runs against a working tree that
#      has been lived in. Nothing has ever proven the package checks from what
#      git actually contains.
#   2. A CLEAN PACKAGE LIBRARY. The host library accumulated over 0.1.0's whole
#      development. An accidental dependency on something installed but not
#      declared would be invisible to it and fatal on a user's machine.
#   3. NATIVE amd64. docs/check-matrix.md carries two harness caveats because
#      its Ubuntu rows run emulated on an arm64 Mac -- a source-built `fs`
#      needing libuv1-dev, and GNU tar 1.35 unable to extract into a
#      subdirectory under emulation. Native execution settled both on
#      2026-08-02: libuv1-dev is a genuine system requirement and is installed
#      below, while the tar failure does not exist off the emulator, because a
#      runner clones with git and never reaches tar.
#   4. A RESULT TIED TO A COMMIT. The hook proves a tree passed on the way out;
#      it leaves no artifact saying which one.
#
# WHAT THIS DOES NOT ADD, stated so the gap is not quietly closed by implication:
# not Windows, which is still checked by nothing (RADD-xxuzwmuj holds that, and
# the answer there is win-builder, not a runner -- GitLab's two Windows shared
# runners report online=true but status=paused); not macOS beyond the pre-push
# hook, and a self-hosted Mac runner is REJECTED, not pending (see RADD-fgciezpx
# for why a route to an already-covered platform is worth nothing); not minimum
# dependency versions, which check-dep-floor.sh measures at exactly vctrs 0.7.0
# on R 4.0.0; and no additional semantic diversity, since the libc dialects are
# already measured under glibc and musl by data-raw/oracle-libc-linux.sh
# independent of any pipeline.
#
# THE CHECK COMMANDS ARE NOT HERE. They are in data-raw/verify.sh, which the
# pre-push hook also calls. That is what keeps "the hook runs the same chain as
# CI" a fact instead of a hand-maintained coincidence, and it is what keeps a
# move to any other provider small: a provider installs an environment and calls
# a script. It is also load-bearing for the rule set below, which is only
# affordable BECAUSE the hook runs the identical chain on the merge requests
# that no longer get a pipeline.

default:
  image: rocker/r-ver:latest
  # Free-tier compute minutes are finite and superseded pipelines answer a
  # question nobody is still asking.
  interruptible: true

# CI RUNS ON VERSION BUMPS, NOT ON EVERY MERGE REQUEST (RADD-ofvmkjsj).
#
# This replaces two earlier postures and is not a compromise between them. Until
# 2026-08-13 the rules ran unconditionally on merge_request_event, so every MR
# spent runner minutes re-running a chain the pre-push hook had already run on
# the same commit. From 2026-08-13 the rules were narrowed to `web`/`api` alone
# because the namespace had exhausted its free-tier minutes (RADD-jzwticug), and
# that pause had no principle in it beyond "stop spending" -- which is exactly
# the kind of posture that becomes permanent by inattention.
#
# The question the earlier rules never asked is WHEN the four things a laptop
# cannot assert about itself -- a clean clone, a clean package library, native
# amd64, and a result tied to a commit -- are actually worth a runner minute.
# The answer is: when the thing being built is the thing a user installs. That is
# a version bump, and it is not every merge request. A refactor with the version
# unchanged ships to nobody; DESCRIPTION moving is the tree saying it intends to.
#
# So the gate fires on a merge request that CHANGES DESCRIPTION. That is broader
# than "Version: changed" and deliberately so, because GitLab cannot express the
# narrower rule and because the broader one is the better rule anyway: a new
# Imports: entry or a raised floor is precisely a change whose closure a clean
# package library should resolve from scratch. It fires BEFORE the merge, which
# a tag rule cannot do.
#
# And a v* tag fires the same pipeline again, for a different reason: the tag is
# the commit that gets submitted, and the fourth property above is "a result tied
# to a commit". The MR run proves the change; the tag run is the record.
#
# WHAT THIS COSTS, stated plainly so it is not discovered later. Ordinary merge
# requests now create NO pipeline and are checked by the pre-push hook alone.
# That is a real reduction in coverage and it is affordable for one reason only:
# data-raw/verify.sh is the same chain, so what an ordinary MR loses is the clean
# clone and the clean library, not the checks. If verify.sh ever stops being the
# single definition of the chain, this rule set stops being defensible.
#
# IT IS ALSO NOT A MERGE GATE. Measured 2026-09-05: the project carries
# only_allow_merge_if_pipeline_succeeds=false, flipped off during the quota
# incident. It must STAY off -- with these rules an ordinary MR has no pipeline
# at all, and GitLab blocks a merge when that setting is on and no pipeline
# exists (measured on MR !27). The consequence is that a red version-bump
# pipeline does not stop anyone merging. This is evidence, not enforcement; the
# pre-push hook is what actually refuses.
#
# IT DRIFTED BACK ON, and this is what that looks like from the inside so the
# next person spends a minute on it rather than an hour. Measured 2026-09-06:
# only_allow_merge_if_pipeline_succeeds=true, allow_merge_on_skipped_pipeline
# =false. Two docs-only merge requests that day (!36, !37) touched no
# DESCRIPTION, so the rules above created no pipeline for either, so GitLab
# refused both with "This merge request requires a passing pipeline before
# merging" -- an error that names a FAILING pipeline while the actual condition
# is that NO pipeline exists. glab reports `pipeline: None` and
# `detailed_merge_status: ci_must_pass`; that pair is the signature.
#
# Two ways out, and they are not equivalent. The escape hatch below unblocks one
# MR: `glab ci run -b <branch>` creates an api-source pipeline, which the rules
# do admit, and the merge then proceeds. It has to be repeated for every
# non-DESCRIPTION MR. The fix is to restore the setting:
#
#   glab api projects/:id -X PUT -f only_allow_merge_if_pipeline_succeeds=false
#
# Prefer the fix. Widening the rules so ordinary MRs get a pipeline is the other
# option and it is a real one, but it spends CI minutes on every MR, which is
# the thing the quota incident was about.
workflow:
  rules:
    # THE GATE. Before the merge, on the change that says a release is intended.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - DESCRIPTION
    # THE RECORD. After the merge, tied to the commit that carries the version.
    # Tag creation is restricted to Maintainers (v*, protected since 2026-08-02),
    # so this cannot be triggered by an ordinary push.
    - if: $CI_COMMIT_TAG =~ /^v/
    # Started by hand from the UI or the API -- `glab ci run -b <branch>`. This is
    # how a branch gets proven before it has an MR, and it is the escape hatch for
    # any change that wants a clean-room check without touching DESCRIPTION.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

variables:
  # A project-local library, so the cache below has something to carry and so
  # the job cannot silently depend on whatever the image happens to ship.
  R_LIBS_USER: "$CI_PROJECT_DIR/.rlib"
  # rcmdcheck shells out to `R CMD check`; keeping sources makes a traceback in
  # the log point at a line rather than at a byte offset.
  R_KEEP_PKG_SOURCE: "yes"
  GIT_DEPTH: "1"

.r-job:
  variables:
    # The images carry no LaTeX toolchain and gain nothing from one. The
    # pre-push hook deliberately does not set this; see data-raw/verify.sh.
    NO_MANUAL: "1"
  cache:
    # Keyed on DESCRIPTION, so the library is rebuilt exactly when the declared
    # closure changes and reused when it has not. Shared-runner caches are
    # best-effort and frequently cold: this is a speed optimisation, never a
    # correctness input. `policy` stays the default pull-push.
    #
    # THE VERSION-BUMP RULES MAKE THIS MOSTLY COLD, and that is not a bug to
    # tune away. The gate fires precisely WHEN DESCRIPTION CHANGES, and the key
    # is DESCRIPTION's content, so a gated merge-request run is a cache miss by
    # construction -- it is asking for a clean library, which is the point. The
    # one run that reliably hits is the v* tag pipeline, whose DESCRIPTION is
    # the same file the merge-request run just built against. Manual and
    # scheduled runs hit or miss as before.
    key:
      files:
        - DESCRIPTION
    paths:
      - .rlib/
  before_script:
    # data-raw/check-matrix.sh's apt list, plus one entry it does not need, for
    # the same reasons: pandoc so the vignettes really re-build instead of being
    # skipped, libhunspell-dev and libxml2-dev for spelling, qpdf for the PDF
    # checks --as-cran performs, and libuv1-dev because fs links libuv and is
    # how testthat and rmarkdown both reach the filesystem through pkgload.
    #
    # libcurl4-openssl-dev and libssl-dev are the entry that is new here, and
    # they were DISCOVERED BY THE FIRST RUN rather than carried over --
    # pipeline 2725127124, where check:linux-devel failed with "Configuration
    # failed because libcurl was not found" while check:linux-release passed.
    # Worth recording precisely, because the difference between the two jobs is
    # the whole reason this file has a devel job at all:
    #
    #   * rcmdcheck imports curl. verify.sh calls rcmdcheck rather than
    #     `R CMD check` because only rcmdcheck offers error_on = "warning",
    #     which is what makes a WARNING fail the gate. So curl is a build
    #     dependency of the GATE, not of raddr.
    #   * The release job installs a p3m BINARY of curl, already linked, and so
    #     never sees the requirement. The devel job resolves against
    #     cloud.r-project.org because p3m serves no R-devel binaries, builds
    #     curl from source, and needs the headers.
    #   * check-matrix.sh's devel row never hit this because it calls
    #     `R CMD check` directly and so never installs rcmdcheck at all.
    #
    # That is the same shape as the libuv1-dev finding: a system requirement
    # that is invisible wherever a binary is available and fatal wherever one is
    # not. On GitHub, setup-r-dependencies resolves this whole category
    # automatically; this line is the hand-maintained stand-in, so expect a
    # future source-built dependency to add another entry, and read a failure of
    # this shape as a missing -dev package before anything else.
    #
    # Every command below is a literal block scalar. That is not a style
    # choice: a plain YAML scalar may not contain ": ", and the vctrs assert
    # further down calls message("vctrs: ", v). It parsed as a mapping and the
    # file was rejected. Keeping the whole list in one form stops the next
    # command from re-discovering that.
    - |
      apt-get update
    - |
      apt-get install -y --no-install-recommends \
        pandoc libhunspell-dev libxml2-dev libuv1-dev qpdf \
        libcurl4-openssl-dev libssl-dev
    - |
      mkdir -p "$R_LIBS_USER"
    # Every Suggests package is installed deliberately, for the reason the
    # GitHub workflow gives: a check that skips is not a check that passed.
    # tests/testthat/test-hedgehog.R skips whole when hedgehog is absent, and
    # the bignum, bit64 and digest paths do the same.
    - |
      Rscript -e 'p <- c("rlang", "vctrs", "bignum", "bit64", "digest", "hedgehog", "knitr", "rmarkdown", "spelling", "testthat", "lintr", "rcmdcheck"); m <- p[!vapply(p, requireNamespace, logical(1), quietly = TRUE)]; if (length(m)) install.packages(m, Ncpus = 4); ok <- vapply(p, requireNamespace, logical(1), quietly = TRUE); print(ok); if (!all(ok)) quit(status = 1)'
    # Asserted rather than assumed, because vctrs is the one dependency whose
    # version has already produced a wrong conclusion. vctrs < 0.7.0 modifies
    # vctrs_rcrd types in place in vec_assign(), which corrupts raddr_address
    # (RADD-vppmbsia). A job resolving 0.6.5 -- from a stale cache, say -- would
    # report test failures that have nothing to do with the thing it is varying.
    - |
      Rscript -e 'v <- packageVersion("vctrs"); message("vctrs: ", v); if (v < "0.7.0") quit(status = 1)'
    # The record of what "current" resolved to on this run. No date is pinned,
    # deliberately: these jobs ask about platform and about upcoming R, and both
    # questions are only meaningful against packages as they are now. Since
    # "current" is not reproducible, only this record makes a run checkable
    # after the fact. data-raw/check-r-floor.sh pins precisely because it asks a
    # different question.
    - |
      Rscript -e 'cat(R.version.string, "\n"); cat("platform:", R.version[["platform"]], "\n"); cat("repos:", getOption("repos")[["CRAN"]], "\n"); ip <- installed.packages(); ip <- ip[is.na(ip[, "Priority"]), c("Package", "Version"), drop = FALSE]; write.table(ip[order(rownames(ip)), ], quote = FALSE, row.names = FALSE, col.names = FALSE)'
  script:
    - |
      sh data-raw/verify.sh

check:linux-release:
  extends: .r-job

check:linux-devel:
  extends: .r-job
  image: rocker/r-ver:devel
  # NO `rules:` OVERRIDE ANY MORE, and removing it is the one place the
  # version-bump posture makes this file STRONGER rather than cheaper.
  #
  # This job used to carry `when: manual` with `allow_failure: true`, justified
  # in exactly these words: it "catches upcoming breakage, which is worth having
  # before a release and is not worth paying for on every MR". That reasoning was
  # sound and its conclusion was self-defeating -- a manual job on a free-tier
  # budget is a job nobody starts, so the thing worth having before a release was
  # not in fact had before a release. AGENTS.md had to warn readers not to read a
  # green pipeline as two-platform evidence.
  #
  # The workflow rules now fire only on a version bump or a v* tag, which IS
  # "before a release". So the condition the old rule was approximating by hand
  # is the pipeline's own trigger, and the job simply inherits it. This image
  # still resolves against cloud.r-project.org -- p3m serves no R-devel binaries,
  # so every dependency is a source build and this is the long job -- but it is
  # now a long job that runs a handful of times a year instead of a short one
  # that never ran at all.
  #
  # allow_failure is NOT set, so R-devel breakage turns the pipeline red. That is
  # deliberate and it is cheap here: with only_allow_merge_if_pipeline_succeeds
  # off, red is information rather than a block, and upcoming-R breakage before a
  # CRAN submission is information worth having loudly.

# CITATION.cff's `version:` and .zenodo.json's `"version"` must name the release
# DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 -> X.Y.Z), plus
# every URL those two files declare must also appear in DESCRIPTION's URL field.
# Ported from seor, where the rule is design/adr/0001 and design/adr/0002.
#
# raddr carries NEITHER file today (SEOR-lreejxat item 4 is an open owner
# decision). The gate reads absence as nothing to check rather than as a
# violation, so this job passes either way and is in place before the files can
# arrive.
#
# The workflow rules above mean this pipeline fires on a DESCRIPTION-changing
# MR, a v* tag, or a hand-started run -- which is exactly the moment the rule
# cares about, since both files move at the DESCRIPTION bump rather than at the
# tag. So this job does not need rules of its own.
#
# Offline and stdlib-only: no R image, no `.r-job`, no cache. It costs seconds,
# which matters on a concurrency-1 runner where the two check jobs are long.
citation-version:
  stage: test
  image: python:3.13-alpine
  cache: []
  before_script: []
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py
