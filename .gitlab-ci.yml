# GitLab CI for raddr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and adds its x-floor job. A push to main or a branch, and a merge request,
# create no pipeline: the merge gate is the local one (.fleet-ci/gate, run by
# the .fleet-ci/pre-push hook). T2 runs on the deep-check schedule
# (SCHEDULE_KIND=deep-check), T3 on a RELEASE=1 web pipeline and a v* tag.
# design/ci.md has the whole picture and the gaps the migration accepted.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 66d8d2d4b888aeb00c4afad15d953a390fd2e9d8
    file: templates/r-package.yml

variables:
  # raddr has no compiled code (no src/), which the sanitizer leg exists
  # for; the former CI had no sanitizer job either.
  FLEET_SANITIZERS: "false"
  # The template's t2-floor installs into a bare rocker/r-ver:4.1.3, which
  # has no curl binary: every R curl since 7.0.0 wants libcurl >= 7.73, the
  # image's focal has 7.68, and curl's configure then fetches a static
  # libcurl with that binary or fails (`CURLINFO_EFFECTIVE_METHOD
  # undeclared`). rcmdcheck and the audits' oysteR and rosv all need curl.
  # The template installs no apt package, so the floor leg is x-floor, on
  # .t2-job, in its place: the former deep-check:floor recipe.
  FLEET_FLOOR: "false"

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`, in
# place of the template's t2-floor (FLEET_FLOOR above): the former
# `deep-check:floor` job's install, with R CMD check in place of the rest of
# data-raw/verify.sh (lintr, spelling, the URL and floor checks run in T1,
# whatever the R version). 4.1.3 is the last 4.1 patch and the oldest minor
# rocker publishes an arm64 image for, which the runner needs; 4.0.5 has
# none. data-raw/check-floor-drift.R reads the image line below and fails T1
# when it is not DESCRIPTION's floor minor, so keep it one literal line.
#
# - FLOOR_SNAPSHOT is the newest p3m date whose closure builds on this image
#   (Ubuntu 20.04: gcc 9, libcurl 7.68), and its window is narrow. vctrs
#   0.7.0, the Imports floor, reached CRAN on 2026-01-16; bit64 4.8.0, whose
#   integer64.h puts `__has_builtin(...)` in an #if that gcc 9 rejects, is in
#   every snapshot from 2026-04-22. So 2026-04-21 (bit64 4.6.0-1, vctrs
#   0.7.3); 2026-09-01 failed on exactly that in pipeline 2909397520
#   (SEOR-lavybtkr). Source packages: the runner is arm64. Move the date
#   forward only to a snapshot re-proven in this image.
# - The apt line is the former .r-job's, less pandoc: curl, the binary, for
#   curl's static libcurl (above); the libcurl and OpenSSL headers for curl
#   and openssl; libxml2 and hunspell for spelling; libuv for fs; qpdf for
#   --as-cran's PDF checks.
# - Every Suggests package is installed, as before: a check that skips is
#   not a check that passed (test-property.R skips whole without hedgehog,
#   and the bignum, bit64 and digest paths do the same). vctrs is asserted
#   at or above 0.7.0 (RADD-vppmbsia), and what the snapshot resolved is
#   printed, since only that record makes the run checkable afterwards.
# - Vignettes are neither built nor checked: this image has no pandoc (the
#   former job installed one), as in the template's t2-floor. The check is
#   --as-cran with CRAN incoming off (_R_CHECK_CRAN_INCOMING_ below; the two
#   R_CRAN_* variables point any CRAN metadata read at cloud.r-project.org
#   rather than the snapshot), error_on = "warning", and the template
#   t2-floor's two guards: a `Status:` line in 00check.log, then R CMD
#   check's own exit status, because rcmdcheck reads a check that halted
#   partway as 0/0/0 and returns normally, and a halt can exit 0
#   (SEOR-maavnxdm).
#
# BLOCKING, like every T2 leg: a scheduled detector that cannot go red is
# worthless.
x-floor:
  extends: .t2-job
  image: rocker/r-ver:4.1.3
  variables:
    FLOOR_SNAPSHOT: "https://p3m.dev/cran/2026-04-21"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    # Incoming off: .t2-job runs this leg in v* tag pipelines too, where the
    # incoming feasibility check's "Insufficient package version" (the tag's
    # version already on CRAN) would fail it and so block `pages`. t2-ascran
    # runs the incoming checks, on R release.
    _R_CHECK_CRAN_INCOMING_: "false"
  script:
    - |
      apt-get update -qq
      apt-get install -y --no-install-recommends \
        libhunspell-dev libxml2-dev libuv1-dev qpdf \
        libcurl4-openssl-dev libssl-dev curl
    - |
      Rscript -e 'options(repos = c(CRAN = Sys.getenv("FLOOR_SNAPSHOT")))
        p <- c("rlang", "vctrs", "bignum", "bit64", "digest", "hedgehog", "knitr",
          "oysteR", "rmarkdown", "rosv", "spelling", "testthat", "rcmdcheck")
        install.packages(p, Ncpus = 4L)
        ok <- vapply(p, requireNamespace, NA, quietly = TRUE)
        print(ok)
        if (!all(ok)) quit(status = 1)
        v <- packageVersion("vctrs")
        message("vctrs: ", v)
        if (v < "0.7.0") quit(status = 1)
        cat(R.version.string, "\n")
        ip <- installed.packages()
        ip <- ip[is.na(ip[, "Priority"]), c("Package", "Version"), drop = FALSE]
        write.table(ip[order(rownames(ip)), ], quote = FALSE, row.names = FALSE, col.names = FALSE)'
    - |
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
        build_args = c("--no-manual", "--no-build-vignettes"),
        error_on = "warning", check_dir = "check")
        log <- file.path(res$checkdir, "00check.log")
        if (!file.exists(log) || !any(grepl("^Status:", readLines(log, warn = FALSE)))) stop("R CMD check did not complete", call. = FALSE)
        if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week
