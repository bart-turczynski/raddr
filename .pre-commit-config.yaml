# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). The chain lives in
# data-raw/verify.sh instead, so the hook has one argument and no shell quoting
# is involved -- and, more to the point, so the hook and .gitlab-ci.yml run the
# same chain because it is the same file, not because two copies were kept in
# step by hand (RADD-fgciezpx).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: trailing-whitespace
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-case-conflict
  - repo: local
    hooks:
      # Scoped to the five files that can put the declared floors out of step
      # with the measured ones, and run at COMMIT time rather than push time on
      # purpose: the moment DESCRIPTION is edited is the moment the answer is
      # cheap to act on. data-raw/verify.sh runs the same script unconditionally
      # at push time and in CI, so this hook is the fast local signal and not
      # the gate. RADD-olitgnsw.
      - id: floor-drift
        name: declared floors match the measured ones
        entry: Rscript data-raw/check-floor-drift.R --self-test
        language: system
        pass_filenames: false
        files: '^(DESCRIPTION|data-raw/check-(r|dep)-floor\.sh|data-raw/check-floor-drift\.R|docs/(r|dep)-floor-check\.md)$'
        verbose: true
      - id: verify
        # NO_MANUAL is deliberately not set here: the host has a LaTeX
        # toolchain and CI images do not. See data-raw/verify.sh.
        name: verify (the same chain CI runs)
        entry: sh data-raw/verify.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
