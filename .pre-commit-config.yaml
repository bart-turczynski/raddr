# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). The chain lives in
# data-raw/verify.sh instead, so the hook has one argument and no shell quoting
# is involved -- and, more to the point, so the hook and .gitlab-ci.yml run the
# same chain because it is the same file, not because two copies were kept in
# step by hand (RADD-fgciezpx).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: trailing-whitespace
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-case-conflict
  # spelling::spell_check_package() (data-raw/verify.sh) reads DESCRIPTION,
  # roxygen, vignettes, README and NEWS, but not code, comments, string
  # literals or tooling. This covers those for British spellings. Skipped:
  # generated man/, fixture and upstream data, the tracker snapshot, and what
  # docs/ holds as a record rather than prose -- the run transcripts
  # (AGENTS.md: never edited to match a later state) and docs/research/
  # (evidence, docs/research/README.md). SEOR-xtmnpmae.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(man/|inst/extdata/|tests/testthat/fixtures/|docs/research/|docs/tracker-snapshot\.md$|docs/(check-matrix|ci-workflow-lint|dep-floor-check|gitlab-ci|r-floor-check|release-build|win-builder)\.md$)'
  - repo: local
    hooks:
      # Scoped to the files that can put the declared floors out of step with
      # the measured ones (.gitlab-ci.yml carries the R floor leg), and run at
      # COMMIT time rather than push time on purpose: the moment DESCRIPTION
      # is edited is the moment the answer is cheap to act on.
      # data-raw/verify.sh runs the same script unconditionally at push time
      # and in CI, so this hook is the fast local signal and not the gate.
      # RADD-olitgnsw.
      - id: floor-drift
        name: declared floors match the measured ones
        entry: Rscript data-raw/check-floor-drift.R --self-test
        language: system
        pass_filenames: false
        files: '^(DESCRIPTION|\.gitlab-ci\.yml|data-raw/check-(r|dep)-floor\.sh|data-raw/check-floor-drift\.R|docs/(r|dep)-floor-check\.md)$'
        verbose: true
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 ->
      # X.Y.Z), and every URL those two files declare must also appear in
      # DESCRIPTION's URL field. Ported from seor, where the rule is
      # design/adr/0001 and design/adr/0002.
      # raddr carries both files (RADD-dxzfcbjx).
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports: keeps the /-/issues form the CRAN incoming
      # check string-tests (pslr 1.2.1's first upload was archived for
      # /-/work_items there), man/raddr-package.Rd mirrors it, and no
      # human-facing file links /-/issues, which 404s signed out. Ported from
      # pagerankr (SEOR-ocbtrrnl); the script's docstring has the reasoning.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing files)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # offline and instant, and it runs ahead of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify
        # NO_MANUAL is deliberately not set here: the host has a LaTeX
        # toolchain and CI images do not. See data-raw/verify.sh.
        name: verify (the same chain CI runs)
        entry: sh data-raw/verify.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
