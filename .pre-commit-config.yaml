# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref's tip, then this file's
# pre-push stage. The gate itself, the former data-raw/verify.sh chain
# (floor drift, lintr, spelling, docs drift, the URL check, R CMD check) plus
# README drift and the NEWS heading, is in .fleet-ci.yml, never here: this
# file must not run .fleet-ci/gate (fleet-ci README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet
      # checker requires byte for byte; re-run bin/vendor rather than
      # editing it.
      - id: end-of-file-fixer
        exclude: '^(\.fleet-ci/|inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: trailing-whitespace
        exclude: '^(\.fleet-ci/|inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: '^(\.fleet-ci/|inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-case-conflict
  # spelling::spell_check_package() (the gate's docs tier, .fleet-ci.yml)
  # reads DESCRIPTION, roxygen, vignettes, README and NEWS, but not code,
  # comments, string literals or tooling. This covers those for British
  # spellings. Skipped: generated man/, fixture and upstream data, the
  # tracker snapshot, what docs/ holds as a record rather than prose -- the
  # run transcripts (AGENTS.md: never edited to match a later state) and
  # docs/research/ (evidence, docs/research/README.md) -- and .fleet-ci/
  # (fleet-ci's bin/vendor output). SEOR-xtmnpmae.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|inst/extdata/|tests/testthat/fixtures/|docs/research/|docs/tracker-snapshot\.md$|docs/(check-matrix|ci-workflow-lint|dep-floor-check|gitlab-ci|r-floor-check|release-build|win-builder)\.md$)'
  - repo: local
    hooks:
      # Scoped to the files that can put the declared floors out of step with
      # the measured ones (.gitlab-ci.yml carries the R floor leg, x-floor),
      # and run at COMMIT time rather than push time on purpose: the moment
      # DESCRIPTION is edited is the moment the answer is cheap to act on.
      # The gate's full tier runs the same script unconditionally (a cheap
      # gate in .fleet-ci.yml), so this hook is the fast local signal and
      # not the gate. RADD-olitgnsw.
      - id: floor-drift
        name: declared floors match the measured ones
        entry: Rscript data-raw/check-floor-drift.R --self-test
        language: system
        pass_filenames: false
        files: '^(DESCRIPTION|\.gitlab-ci\.yml|data-raw/check-(r|dep)-floor\.sh|data-raw/check-floor-drift\.R|docs/(r|dep)-floor-check\.md)$'
        verbose: true
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 ->
      # X.Y.Z), and every URL those two files declare must also appear in
      # DESCRIPTION's URL field. Ported from seor, where the rule is
      # design/adr/0001 and design/adr/0002.
      # raddr carries both files (RADD-dxzfcbjx). Offline, stdlib-only and
      # instant, so it runs on every push, after the gate.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports:, man/raddr-package.Rd and every tracker link
      # (codemeta.json, .bestpractices.json, CONTRIBUTING.md, SECURITY.md)
      # name /-/work_items, and no human-facing file may carry a /-/issues
      # link (seor ADR 0011, SEOR-sptibjph). Seor's v2, ported; the script's
      # docstring has the reasoning.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # NEWS.md bullets are one terse line: user-facing changes only, one
      # source line, at most 32 words, at most one reference, no housekeeping
      # and no Internal section (seor's design/fleet-standard.md, "NEWS.md
      # bullets"; SEOR-mjrpwnqz). Seor's reference copy, ported byte for
      # byte; the script's docstring has the reasoning. Its self-test runs
      # when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # Warns, loudly, when this clone's pre-push hook is not fleet-ci's, so
      # the push ran without the gate. Warn-only by decision, time-boxed until
      # the hook is installed fleet-wide, then it fails (SEOR-cjxarlcq). It
      # only reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed (warn-only)
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
