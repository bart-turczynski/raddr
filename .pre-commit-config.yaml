# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). The chain lives in
# data-raw/verify.sh instead, so the hook has one argument and no shell quoting
# is involved -- and, more to the point, so the hook and .gitlab-ci.yml run the
# same chain because it is the same file, not because two copies were kept in
# step by hand (RADD-fgciezpx).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: trailing-whitespace
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: '^(inst/extdata/|tests/testthat/fixtures/wpt/)'
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: verify
        # NO_MANUAL is deliberately not set here: the host has a LaTeX
        # toolchain and CI images do not. See data-raw/verify.sh.
        name: verify (the same chain CI runs)
        entry: sh data-raw/verify.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
