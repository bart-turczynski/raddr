# Mirrors the pre-push `verify` hook in .pre-commit-config.yaml, across the
# platforms one laptop cannot be. The hook runs lintr, then spelling, then
# rcmdcheck --as-cran, on whatever host invokes it -- macOS arm64 on R 4.6.0 for
# the whole of 0.1.0's development. CRAN checks Windows, Linux and r-devel, so
# the two jobs below are split to match the hook rather than to be tidy:
# `verify` is the hook's first two steps, which are host-independent and need to
# run once; `R-CMD-check` is its third, which is the one that varies by platform.
#
# Nothing here has ever run. It is committed unexercised, on purpose: the
# repository has had no reachable remote since 2026-07-20, and AGENTS.md
# described this file's chain as "the same chain CI runs" while no .github/
# directory existed. Writing it makes that sentence true on the first push
# instead of leaving a claim with nothing behind it. Expect the usual first-run
# corrections to a workflow authored blind.
name: R-CMD-check

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  verify:
    # The host-independent two thirds of the pre-push hook. Kept as its own job
    # so a lint or spelling failure is legible immediately rather than being
    # found five times in parallel across the matrix.
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::spelling
          needs: lint

      # Same two calls as the hook, in the same order, failing the same way.
      # spelling::spell_check_package() is what RADD-bxjyndha wired in to stop
      # the Language: en-US field in DESCRIPTION from being an unguarded claim.
      - name: lint
        run: lintr::lint_package()
        shell: Rscript {0}

      - name: spelling
        run: |
          words <- spelling::spell_check_package()
          if (nrow(words)) { print(words); quit(status = 1) }
        shell: Rscript {0}

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # macos-latest on release is the closest match to the machine the
          # local gate has always run on; the other four are the coverage the
          # laptop cannot provide.
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # DESCRIPTION declares Depends: R (>= 4.0.0). These two probe toward
          # that floor without reaching it -- see AGENTS.md on why the floor is
          # still a claim rather than a measurement.
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # knitr and rmarkdown are Suggests and VignetteBuilder is knitr, so the
      # vignettes need pandoc to build under --as-cran.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Every Suggests package is installed deliberately. A check that skips is
      # not a check that passed: tests/testthat/test-hedgehog.R skips whole when
      # hedgehog is absent, and the bignum, bit64 and digest paths do the same.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # --as-cran matches the hook. The manual is skipped because it needs a
          # LaTeX toolchain that adds nothing this package's checks depend on.
          args: 'c("--no-manual", "--as-cran")'
